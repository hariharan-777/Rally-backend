server:
  port: 4004

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://user-service:4000
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
            - id: venue-service
              uri: http://venue-service:4006
              predicates:
                - Path=/api/venues/**
              filters:
                - StripPrefix=1
