spring.application.name=venue-service
server.port=${SERVER_PORT:4006}

# Needs PostgreSQL with the PostGIS extension available (e.g. the postgis/postgis:16 image).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/venuedb}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# Flyway owns the schema (db/migration); Hibernate must not change it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
