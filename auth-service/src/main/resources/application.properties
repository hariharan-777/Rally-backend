spring.application.name=auth-service
server.port=${SERVER_PORT:4005}

# Development default. Set JWT_SECRET to a unique 32+ byte value before deployment.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
